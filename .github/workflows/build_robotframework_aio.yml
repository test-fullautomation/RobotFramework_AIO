name: Build RobotFramework AIO packages

on:
  push:
    tags:
      - "rel/aio/*.*.*.*"
      - "dev/aio/*.*.*.*"
  pull_request:
    types:
      - closed
      - opened
      - synchronize
    branches:
      - develop
  workflow_dispatch:

  repository_dispatch:
    types:
      - TRIGGER_AIO

env:
  GITHUB_PAT : ${{ secrets.PAT_GITHUB }}
  GH_TOKEN: ${{ github.token }}
  TRIGGER_BY: ${{ github.ref_type }}
  TAG_NAME: ${{ github.ref_name }}
  REF_NAME: ${{ github.ref_name }}
  DEFAULT_REF: ${{ github.base_ref }}
  GENDOC_PLANTUML_PATH: "../robotvscode/data/extensions/jebbs.plantuml-2.18.1"
  INSTALLER_LOCATION: "https://github.com/test-fullautomation/RobotFramework_AIO/releases"
  GITHUB_COPILOT_REF_URL: "https://docs.github.com/en/enterprise-cloud@latest/copilot/managing-copilot/managing-copilot-as-an-individual-subscriber/managing-your-copilot-subscription"
  GITHUB_COPILOT_EXT_ARG: ""
  VARIANT: "OSS"

jobs:
  tag-repos:
    name: Tag all related repositories
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: python -m pip install -r ./tools/git-tag/requirements.txt

    - name: Tag repositories
      run: python ./tools/git-tag/git-tag.py "$TAG_NAME" ./config/repositories/tag_repos.json

  trigger-aio:
    runs-on: ubuntu-latest
    name: Listen event trigger
    if: github.event.action == 'TRIGGER_AIO'
    outputs:
      repository: ${{ steps.extract_data.outputs.REPOSITORY }}
      branch: ${{ steps.extract_data.outputs.PULL_MERGE_BRANCH }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract request data
        id: extract_data
        run: |
          # Extract value from request JSON payload
          repository=$(jq -r .client_payload.repository $GITHUB_EVENT_PATH)
          branch=$(jq -r .client_payload.branch $GITHUB_EVENT_PATH)
          echo "REPOSITORY=${repository#test-fullautomation/}"  >> "$GITHUB_OUTPUT"
          echo "PULL_MERGE_BRANCH=$branch"  >> "$GITHUB_OUTPUT"

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        version: [original, extended]
    name: Build Linux packages
    runs-on: ubuntu-latest
    needs: [ tag-repos , trigger-aio ]
    if: ${{ ! failure() && ! cancelled() }}
    env:
      MAINDOC_CONFIGFILE: --configfile "./maindoc/maindoc_configs/maindoc_config_OSS_${{ matrix.version }}.json"
      REPO_CONFIG: "./config/repositories/repositories_${{ matrix.version }}.conf"
      AIO_NAME: "RobotFramework AIO (${{ matrix.version }})"
      BUNDLE_NAME: --bundle_name "RobotFramework AIO"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          df -h

      - name: Install dependencies and set environment variables
        run: |
          sudo apt-get update
          sudo apt-get install --fix-missing
          chmod +x ./requirements_linux.sh
          ./requirements_linux.sh
          echo "AIO_VERSION_DATE=$(date +%m.%Y)" >> $GITHUB_ENV
          echo "AIO_VERSION=${TAG_NAME#[rd]e[vl]/aio/}" >> $GITHUB_ENV
          echo "BUNDLE_VERSION_DATE=--bundle_version_date \"$(date +%m.%Y)\"" >> $GITHUB_ENV
          echo "BUNDLE_VERSION=--bundle_version \"${TAG_NAME#[rd]e[vl]/aio/}\"" >> $GITHUB_ENV
          # Environment variable for trigger process
          echo "REPOSITORY=${{needs.trigger-aio.outputs.repository}}" >> $GITHUB_ENV
          echo "PULL_REQUEST_BRANCH=${{needs.trigger-aio.outputs.branch}}" >> $GITHUB_ENV

          # Update placeholders install-github-copilot-exts.sh script
          sed -i "s|\$PLACEHOLDER_REF_URL|${GITHUB_COPILOT_REF_URL}|g" ./install/install-github-copilot-exts.sh
          sed -i "s|\$GITHUB_COPILOT_EXT_ARG|${GITHUB_COPILOT_EXT_ARG}|g" ./config/build/dpkg_build/postinst.sh

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: linux-pip-${{ hashFiles('**/python_requirements_lx.txt') }}
          restore-keys: |
            linux-pip-

      - name: Clone repositories
        run: |
          chmod +x ./cloneall
          ./cloneall --config-file=${REPO_CONFIG}

      - name: Install
        run: |
          chmod +x ./install/install.sh
          ./install/install.sh

      - name: Build
        run: |
          chmod +x ./build
          ./build --config-file=${REPO_CONFIG} --sub-version=${{ matrix.version }}

      - name: Update all documents
        if: ${{ github.ref_type == 'tag' }}
        run: |
          cd ../robotframework-documentation
          doc_branch=automation/task/update-rfw-documents-${{ matrix.version }}
          git config user.email "huavanthong14@gmail.com"
          git config user.name "Thong Hua"
          git checkout -b $doc_branch
          git remote add doc-repo https://${{ secrets.PAT_THONG }}@github.com/test-fullautomation/robotframework-documentation.git
          git add RobotFrameworkAIO/Components*.html
          git add RobotFrameworkAIO/RobotFrameworkAIO_Reference*.pdf
          git add RobotFrameworkAIO/Components*.rst
          git commit -m "Auto update documents of ${{ matrix.version }} version in robotframework-documents"
          git push -u -f doc-repo $doc_branch
          echo -e "\e[32;01mPush all changes completely ... \e[0m"

          curl -f -X POST https://api.github.com/repos/test-fullautomation/robotframework-documentation/dispatches \
          --header 'authorization: Bearer ${{ secrets.PAT_THONG }}' \
          -H 'Accept: application/vnd.github.everest-preview+json' \
          --data '{"event_type": "Document", "client_payload": { "repository": "'"$GITHUB_REPOSITORY"'", "branch" : "'"$doc_branch"'"}}'
          if [ $? -ne 0 ]; then
            echo "Error: curl command failed to trigger a document jobs"
            exit 1
          fi

          echo -e "\e[32;01m Trigger jobs for pull request  successfully...\e[0m"

      - name: Update libdoc documents to RobotFramework AIO website
        if: ${{ github.ref_type == 'tag' && matrix.version == 'extended' }}
        run: |
          cd ../RobotFramework_AIO_website
          doc_branch=automation/task/update-rfw-libdoc-documents-${{ matrix.version }}
          git config user.email ${{ secrets.GIT_USER_EMAIL }}
          git config user.name ${{ secrets.GIT_USER_NAME }}
          git checkout -b $doc_branch
          git remote add doc-repo https://${{ secrets.PAT_GITHUB }}@github.com/test-fullautomation/RobotFramework_AIO_website.git
          git add html/libdoc/*.html
          git commit -m "Auto update libdoc documents of ${{ matrix.version }} version in RobotFramework_AIO_website"
          git push -u -f doc-repo $doc_branch
          echo -e "\e[32;01mPush all changes completely ... \e[0m"

          curl -f -X POST https://api.github.com/repos/test-fullautomation/RobotFramework_AIO_website/dispatches \
          --header 'authorization: Bearer ${{ secrets.PAT_GITHUB }}' \
          -H 'Accept: application/vnd.github.everest-preview+json' \
          --data '{"event_type": "Document", "client_payload": { "repository": "'"$GITHUB_REPOSITORY"'", "branch" : "'"$doc_branch"'"}}'
          if [ $? -ne 0 ]; then
            echo "Error: curl command failed to trigger a document jobs"
            exit 1
          fi

          echo -e "\e[32;01m Trigger jobs for pull request  successfully...\e[0m"

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-${{ matrix.version }}
          path: output_lx/*.deb

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: RobotFrameworkAIO_Reference_${{ matrix.version }}
          path: |
            ${{ runner.workspace }}/robotframework-documentation/RobotFrameworkAIO/RobotFrameworkAIO_Reference_${{ matrix.version }}.pdf
            ${{ runner.workspace }}/robotframework-dbus/RobotFramework_DBus/*.html
            ${{ runner.workspace }}/robotframework-doip/RobotFramework_DoIP/*.html
            ${{ runner.workspace }}/robotframework-extensions-collection/RobotframeworkExtensions/*.html
            ${{ runner.workspace }}/robotframework-qconnect-base/QConnectBase/*.html
            ${{ runner.workspace }}/robotframework-qconnect-winapp/QConnectWinapp/*.html
            ${{ runner.workspace }}/robotframework-uds/RobotFramework_UDS/*.html
            ${{ runner.workspace }}/robotframework-testsuitesmanagement/RobotFramework_TestsuitesManagement/*.html

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        version: [original, extended]
    name: Build Windows package
    runs-on: windows-latest
    needs: [ tag-repos , trigger-aio ]
    if: ${{ ! failure() && ! cancelled() }}
    env:
      MAINDOC_CONFIGFILE: --configfile "./maindoc/maindoc_configs/maindoc_config_OSS_${{ matrix.version }}.json"
      REPO_CONFIG: "./config/repositories/repositories_${{ matrix.version }}.conf"
      AIO_NAME: "RobotFramework AIO (${{ matrix.version }})"
      BUNDLE_NAME: --bundle_name "RobotFramework AIO"

    steps:
      - name: Support long path in git
        run: git config --system core.longpaths true

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies and set environment variables
        shell: bash
        run: |
          . ./requirements_windows.sh
          echo "GENDOC_LATEXPATH=$GENDOC_LATEXPATH" >> $GITHUB_ENV
          echo "AIO_VERSION_DATE=$(date +%m.%Y)" >> $GITHUB_ENV
          echo "AIO_VERSION=${TAG_NAME#[rd]e[vl]/aio/}" >> $GITHUB_ENV
          echo "BUNDLE_VERSION_DATE=--bundle_version_date \"$(date +%m.%Y)\"" >> $GITHUB_ENV
          echo "BUNDLE_VERSION=--bundle_version \"${TAG_NAME#[rd]e[vl]/aio/}\"" >> $GITHUB_ENV
          echo "REPOSITORY=${{needs.trigger-aio.outputs.repository}}" >> $GITHUB_ENV
          echo "PULL_REQUEST_BRANCH=${{needs.trigger-aio.outputs.branch}}" >> $GITHUB_ENV

          # Update placeholders install-github-copilot-exts.sh script
          sed -i "s|\$PLACEHOLDER_REF_URL|${GITHUB_COPILOT_REF_URL}|g" ./install/install-github-copilot-exts.ps1

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: $env:LOCALAPPDATA\pip\Cache
          key: windows-pip-${{ hashFiles('**/python_requirements.txt') }}
          restore-keys: |
            windows-pip-

      - name: Clone repositories
        shell: bash
        run: |
          chmod +x ./cloneall
          ./cloneall --config-file=${REPO_CONFIG}

      - name: Install
        shell: bash
        run: ./install/install.sh

      - name: Build
        shell: bash
        run: ./build --config-file=${REPO_CONFIG} --sub-version=${{ matrix.version }}

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-${{ matrix.version }}
          path: Output/

  install-test-windows:
    strategy:
      fail-fast: false
      matrix:
        version: [original, extended]
    name: Test Windows package
    runs-on: windows-latest
    needs: [ build-windows  , trigger-aio ]
    if: ${{ ! failure() && ! cancelled() }}
    env:
      RobotPythonPath: "C:/Program Files/RobotFramework/python3"
      RobotTutorialPath: "C:/RobotTest/tutorial"
      RobotPythonSitePackagesPath: "C:/Program Files/RobotFramework/python3/Lib/site-packages"
      RobotDevtools: "C:/Program Files/RobotFramework/devtools"
      ANDROID_HOME: "C:/Program Files/RobotFramework/devtools/Android"
      APPIUM_HOME: "C:/Program Files/RobotFramework/devtools/nodejs"
      ANDROID_SDK_ROOT: "C:/Program Files/RobotFramework/devtools/Android"
      GENDOC_PLANTUML_PATH: "C:/Program Files/RobotFramework/robotvscode/data/extensions/jebbs.plantuml-2.18.1"
      REPO_CONFIG: "./config/repositories/repositories_${{ matrix.version }}.conf"
      TEST_CONFIG: "./config/testtrigger_config_${{ matrix.version }}.json"
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 300

    steps:
    - name: Support long path in git
      run: git config --system core.longpaths true

    - name: Checkout source
      uses: actions/checkout@v4

    - name: Clone repositories
      shell: bash
      run: |
        export REPOSITORY="${{needs.trigger-aio.outputs.repository}}"
        export PULL_REQUEST_BRANCH="${{needs.trigger-aio.outputs.branch}}"
        chmod +x ./cloneall
        ./cloneall --config-file=${REPO_CONFIG}

    - name: Download Windows installer package
      uses: actions/download-artifact@v4
      with:
        name: windows-package-${{ matrix.version }}

    - name: Install RobotFramework AIO on Windows
      shell: cmd
      run: ./scripts/install-windows.bat

    - name: Check external dependencies version
      shell: bash
      run: |
        chmod +x ./install/check_external_version.sh
        ./install/check_external_version.sh -i ./install/python_requirements.txt -v ./install/vscode_requirement.csv -o ../package_version_report.csv


    - name: Install RabbitMQ
      shell: pwsh
      run: |
        choco install -y erlang --version 26.2.5
        erl -version

        curl -L -o rabbitmq.zip https://github.com/rabbitmq/rabbitmq-server/releases/download/v3.12.1/rabbitmq-server-windows-3.12.1.zip
        mkdir rabbitmq
        tar -xf rabbitmq.zip -C rabbitmq
        $rabbitPath = Join-Path $PWD "rabbitmq\rabbitmq_server-3.12.1"
        $env:RABBITMQ_HOME = $rabbitPath
        $env:PATH = "$rabbitPath\sbin;$env:PATH"

        dir $rabbitPath

        $pluginUrl = "https://github.com/rabbitmq/rabbitmq-rtopic-exchange/releases/download/v3.12.0/rabbitmq_rtopic_exchange-3.12.0.ez"
        $pluginDir = "$rabbitPath\plugins"
        $pluginDest = Join-Path $pluginDir "rabbitmq_rtopic_exchange.ez"

        if (-not (Test-Path $pluginDir)) {
          New-Item -ItemType Directory -Path $pluginDir | Out-Null
        }

        Invoke-WebRequest -Uri $pluginUrl -OutFile $pluginDest

        rabbitmq-plugins.bat enable rabbitmq_rtopic_exchange
        rabbitmq-plugins.bat list -m | findstr rabbitmq_rtopic_exchange

        # Retry starting RabbitMQ server
        $maxStartAttempts = 5
        $startAttempt = 0
        $started = $false
        while (-not $started -and $startAttempt -lt $maxStartAttempts) {
          $startAttempt++
          Write-Host "Starting RabbitMQ server (attempt $startAttempt of $maxStartAttempts)..."
          Start-Process -FilePath "$rabbitPath\sbin\rabbitmq-server.bat" -ArgumentList "-detached" -WindowStyle Hidden
          Start-Sleep -Seconds 10
          try {
            rabbitmq-diagnostics.bat ping
            if ($LASTEXITCODE -eq 0) {
              Write-Host "RabbitMQ started successfully."
              $started = $true
            } else {
              Write-Host "RabbitMQ ping failed, will retry."
            }
          } catch {
            Write-Host "RabbitMQ ping threw an exception, will retry."
          }
          if (-not $started) {
            Write-Host "Killing any existing RabbitMQ processes before retrying."
            Get-Process -Name "erl*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5
          }
        }
        if (-not $started) {
          Write-Host "RabbitMQ failed to start after $maxStartAttempts attempts. Exiting."
          exit 1
        }

        # Double check for RabbitMQ port 5672 to be open
        $maxAttempts = 30
        $waitSeconds = 2
        for ($i=0; $i -lt $maxAttempts; $i++) {
          try {
            $tcpClient = New-Object System.Net.Sockets.TcpClient
            $tcpClient.Connect('localhost', 5672)
            if ($tcpClient.Connected) {
              Write-Host "RabbitMQ is ready."
              $tcpClient.Close()
              break
            }
          } catch {
            Write-Host "Waiting for RabbitMQ to start..."
            $tcpClient.Dispose()
          }
          Start-Sleep -Seconds $waitSeconds
        }

    - name: Run static code analysis on Windows
      shell: bash
      run: |
        "$RobotPythonPath/python" test/aio-static-code-trigger/aio_static_code_trigger.py 2>&1 | tee console_log.txt

    - name: Download and install avd package for Android self-test
      shell: bash
      run: |
        config/tools/download_avd_packages.sh

    - name: Run tests on Windows
      shell: bash
      run: |
        "$RobotPythonPath/python" test/aio-test-trigger/aio-test-trigger.py --configfile ${TEST_CONFIG} 2>&1 | tee console_log.txt
        # Get system error code from python program
        exit_code=${PIPESTATUS[0]}
        if [ $exit_code -ne 0 ]; then
            exit 1
        fi

    - name: Run tests coverage on Windows
      shell: bash
      run: |
        "$RobotPythonPath/python" test/aio-test-trigger/aio-test-coverage.py --configfile ${TEST_CONFIG} 2>&1 | tee console_log.txt
        # Get system error code from python program
        exit_code=${PIPESTATUS[0]}

    - name: Generate release info
      shell: cmd
      run: |
        "%RobotPythonPath%\python" .\tools\release_info\release_info.py --configfile ".\release_info_config_OSS_${{ matrix.version }}.json"
        move .\tools\release_info\release_info_RobotFramework_AIO_*.html ..\
        move .\tools\release_info\release_changelog.html ..\

    - name: Generate tutorial doc
      shell: cmd
      run: |
        "%RobotPythonPath%\python" ..\robotframework-tutorial\__setup\gen_doc_tutorial.py

    - name: Upload test result as artifact
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: windows-aiotestlogfiles-${{ matrix.version }}
        # long path issue on Windows when upload artifact
        # https://github.com/actions/upload-artifact/issues/240
        path: |
          ${{ runner.workspace }}/[Rr]obotframework*/**/*/aiotestlogfiles/*
          ${{ runner.workspace }}/[Pp]ython*/**/*/aiotestlogfiles/*
          ${{ runner.workspace }}/[Rr]obotframework*/**/*/testlogfiles/*
          ${{ runner.workspace }}/[Pp]ython*/**/*/testlogfiles/*
          ${{ runner.workspace }}/Robotframework_AIO/console_log.txt
          ${{ runner.workspace }}/package_version_report.csv
          ${{ runner.workspace }}/[Rr]obotframework*/**/*/*/coverage_report/*
          ${{ runner.workspace }}/[Pp]ython*/**/*/*/coverage_report/*
          ${{ runner.workspace }}/[Rr]obotframework*/**/*/*/coverage_report/*
          ${{ runner.workspace }}/[Pp]ython*/**/*/*/coverage_report/*
          ${{ runner.workspace }}/release_info_RobotFramework_AIO_*.html
          ${{ runner.workspace }}/release_changelog.html
          ${{ runner.workspace }}/Robotframework_AIO/install-windows.log
          ${{ runner.workspace }}/Robotframework_AIO/test/aio-static-code-trigger/static_code_report/*

  install-test-linux:
    strategy:
      fail-fast: false
      matrix:
        version: [original, extended]
    name: Test Linux package
    runs-on: ubuntu-latest
    needs: [ build-linux , trigger-aio ]
    if: ${{ ! failure() && ! cancelled() }}
    env:
      REPO_CONFIG: "./config/repositories/repositories_${{ matrix.version }}.conf"
      TEST_CONFIG: "./config/testtrigger_config_${{ matrix.version }}.json"
      RobotDevtools: "/opt/rfwaio/devtools"

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Clone repositories
      run: |
        export REPOSITORY="${{needs.trigger-aio.outputs.repository}}"
        export PULL_REQUEST_BRANCH="${{needs.trigger-aio.outputs.branch}}"
        chmod +x ./cloneall
        ./cloneall --config-file=${REPO_CONFIG}

    - name: Download Linux installer package
      uses: actions/download-artifact@v4
      with:
        name: linux-package-${{ matrix.version }}

    - name: Install on Linux
      run: |
        sudo apt-get update
        sudo apt-get install ./*.deb --fix-missing

    - name: Check external dependencies version
      run: |
        chmod +x ./install/check_external_version.sh
        ./install/check_external_version.sh -i ./install/python_requirements_lx.txt -v ./install/vscode_requirement.csv -o ../package_version_report.csv

    - name: Start RabbitMQ container
      run: |
          cur_dir=$(pwd)
          cd ../python-rabbitmq-messagebus/test/docker
          docker compose up -d
          cd "$cur_dir"

          for i in {1..30}; do
            nc -z localhost 5672 && echo "RabbitMQ is up" && break
            echo "Waiting for RabbitMQ to start..."
            sleep 2
          done

    - name: Run static code analysis on Linux
      run: |
          . /opt/rfwaio/linux/set_robotenv.sh
          "$RobotPythonPath/python3" test/aio-static-code-trigger/aio_static_code_trigger.py 2>&1 | tee console_log.txt

    - name: Run tests on Linux
      run: |
        . /opt/rfwaio/linux/set_robotenv.sh
          "/opt/rfwaio/python3/bin/python3" test/aio-test-trigger/aio-test-trigger.py --configfile ${TEST_CONFIG} 2>&1 | tee console_log.txt
          # Get system error code from python program
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
              exit 1
          fi

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
        df -h

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        /opt/rfwaio/devtools/nodejs/bin/appium driver install uiautomator2
        /opt/rfwaio/devtools/nodejs/bin/appium driver list --installed

    - name: Run Android selftest
      uses: ReactiveCircus/android-emulator-runner@v2.34.0
      with:
        api-level: 34
        avd-name: my_avd
        target: google_apis
        arch: x86_64
        profile: pixel_xl
        script: |
          export RobotDevtools="/opt/rfwaio/devtools"
          export ANDROID_HOME="/opt/rfwaio/devtools/Android"
          export APPIUM_HOME="/opt/rfwaio/devtools/nodejs/lib/node_modules"
          export ANDROID_SDK_ROOT="/opt/rfwaio/devtools/Android"
          . /opt/rfwaio/linux/set_robotenv.sh
          "/opt/rfwaio/python3/bin/python3" "/home/runner/work/RobotFramework_AIO/robotframework-selftest/testcases/executerobottest.py" --logfile="/home/runner/work/RobotFramework_AIO/robotframework-selftest/testcases/aiotestlogfiles/aiotestlogfile.xml" --robotcommandline="--variable run_on:Github_Action --exclude QConnectSelfTest --exclude SerialSelfTest --exclude DLTSelfTestApp" | tee console_log.txt
          # Get system error code from python program
          exit_code=$?; if [ $exit_code -ne 0 ]; then exit 1; fi

    - name: Run tests coverage on Linux
      run: |
          . /opt/rfwaio/linux/set_robotenv.sh
          "$RobotPythonPath/python3" test/aio-test-trigger/aio-test-coverage.py --configfile ${TEST_CONFIG} 2>&1 | tee console_log.txt
          # Get system error code from python program
          exit_code=${PIPESTATUS[0]}

    - name: Generate release info
      run: |
        . /opt/rfwaio/linux/set_robotenv.sh
        $RobotPythonPath/python3 tools/release_info/release_info.py --configfile ./release_info_config_OSS_${{ matrix.version }}.json
        mv ./tools/release_info/release_info_RobotFramework_AIO_*.html ../

    - name: Generate tutorial doc
      run: |
        . /opt/rfwaio/linux/set_robotenv.sh
        $RobotPythonPath/python3 ../robotframework-tutorial/__setup/gen_doc_tutorial.py

    - name: Upload test result as artifact
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: linux-aiotestlogfiles-${{ matrix.version }}
        path: |
          ${{ runner.workspace }}/**/*/aiotestlogfiles/*
          ${{ runner.workspace }}/**/*/testlogfiles/*
          ${{ runner.workspace }}/**/*/console_log.txt
          ${{ runner.workspace }}/package_version_report.csv
          ${{ runner.workspace }}/**/*/*/coverage_report/*
          ${{ runner.workspace }}/release_info_RobotFramework_AIO_*.html
          ${{ runner.workspace }}/**/*/static_code_report/*

  build-docker:
    name: Build RobotFramework AIO Docker Containers
    runs-on: ubuntu-latest
    needs: [ tag-repos , trigger-aio ]
    if: ${{ ! failure() && ! cancelled() }}
    outputs:
      aio_version: ${{ steps.set_vars.outputs.aio_version }}
    strategy:
      fail-fast: false
      matrix:
        version: [original, extended]
        distro: [oss]
    env:
      BUNDLE_NAME: "--bundle_name 'RobotFramework AIO'"
      AIO_NAME: "RobotFramework AIO (${{ matrix.version }})"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - id: set_vars
        name: Set Environment Variables
        run: |
          # Sanitize tag name: remove prefix and replace '/' with '-'
          # Assuming TAG_NAME is available in env or use github.ref_name
          RAW_TAG="${{ github.ref_name }}"
          TEMP_VERSION=${RAW_TAG#[rd]e[vl]/aio/}
          SAFE_VERSION=$(echo ${TEMP_VERSION//\//-})

          echo "AIO_VERSION=$SAFE_VERSION" >> $GITHUB_ENV
          echo "aio_version=$SAFE_VERSION" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/${{ matrix.distro }}/Dockerfile
          push: true
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/robotframework-aio:${{ env.AIO_VERSION }}-${{ matrix.distro }}-${{ matrix.version }}
          build-args: |
            VERSION_TYPE=${{ matrix.version }}
            TAG_NAME=${{ github.ref_name }}
            AIO_NAME=${{ env.AIO_NAME }}
            VARIANT=${{ env.VARIANT }}
            BUNDLE_NAME=${{ env.BUNDLE_NAME }}
            GENDOC_PLANTUML_PATH=${{ env.GENDOC_PLANTUML_PATH }}
            GITHUB_COPILOT_REF_URL=${{ env.GITHUB_COPILOT_REF_URL }}
            GITHUB_COPILOT_EXT_ARG=${{ env.GITHUB_COPILOT_EXT_ARG }}
            INSTALLER_LOCATION=${{ env.INSTALLER_LOCATION }}

      - name: Export Docker Image to tar
        run: |
          IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/robotframework-aio:${{ env.AIO_VERSION }}-${{ matrix.distro }}-${{ matrix.version }}
          echo "Exporting image $IMAGE_TAG to tar file..."
          docker save -o ${{ env.AIO_VERSION }}-${{ matrix.distro }}-${{ matrix.version }}.tar $IMAGE_TAG

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.distro }}-${{ matrix.version }}
          path: ${{ env.AIO_VERSION }}-${{ matrix.distro }}-${{ matrix.version }}.tar

  install-test-docker:
    strategy:
      fail-fast: false
      matrix:
        version: [original, extended]
        distro: [oss]
    name: Test AIO Docker Container (${{ matrix.distro }}-${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: [ build-docker, trigger-aio ]
    if: ${{ ! failure() && ! cancelled() }}

    env:
      REPO_CONFIG: "./config/repositories/repositories_${{ matrix.version }}.conf"
      TEST_CONFIG: "./config/testtrigger_config_${{ matrix.version }}.json"
      RobotDevtools: "/opt/rfwaio/devtools"
      AIO_IMAGE: "ghcr.io/${{ github.repository_owner }}/robotframework-aio:${{ needs.build-docker.outputs.aio_version }}-${{ matrix.distro }}-${{ matrix.version }}"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Clone repositories
        run: |
          export REPOSITORY="${{needs.trigger-aio.outputs.repository}}"
          export PULL_REQUEST_BRANCH="${{needs.trigger-aio.outputs.branch}}"
          chmod +x ./cloneall
          ./cloneall --config-file=${REPO_CONFIG}

      - name: Start RabbitMQ container
        run: |
          cur_dir=$(pwd)
          cd ../python-rabbitmq-messagebus/test/docker
          docker compose up -d
          cd "$cur_dir"

          for i in {1..30}; do
            nc -z localhost 5672 && echo "RabbitMQ is up" && break
            echo "Waiting for RabbitMQ to start..."
            sleep 2
          done

      - name: Run tests inside AIO Container
        run: |
          WORKSPACE_PARENT=$(dirname ${{ github.workspace }})
          CURRENT_REPO=$(basename ${{ github.workspace }})

          docker run --rm \
            --network host \
            -v $WORKSPACE_PARENT:/workspace \
            -w /workspace/$CURRENT_REPO \
            ${AIO_IMAGE} \
            bash -c "
              # Create a symbolic link to map the host tutorial folder to the expected hardcoded container path
              mkdir -p /root/RobotTest/tutorial
              cp -r /opt/rfwaio/tutorial/* /root/RobotTest/tutorial/
              # Map the standalone JAR to the legacy extension path to satisfy tool dependencies
              mkdir -p /usr/local/lib/plantuml
              sudo curl -L https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar -o /usr/local/lib/plantuml/plantuml.jar
              mkdir -p /opt/rfwaio/robotvscode/data/extensions/jebbs.plantuml-2.18.1/
              sudo ln -s /usr/local/lib/plantuml/plantuml.jar /opt/rfwaio/robotvscode/data/extensions/jebbs.plantuml-2.18.1/plantuml.jar
              # Run static code analysis
              . /opt/rfwaio/linux/set_robotenv.sh
              python3 test/aio-static-code-trigger/aio_static_code_trigger.py 2>&1 | tee static_code_log.txt

              # Run tests coverage
              python3 test/aio-test-trigger/aio-test-coverage.py --configfile ${TEST_CONFIG} 2>&1 | tee coverage_console_log.txt

              # Run tests
              python3 test/aio-test-trigger/aio-test-trigger.py --configfile ${TEST_CONFIG} 2>&1 | tee test_log.txt
              # Get system error code from python program (Catching the test exit code)
              exit_code=\${PIPESTATUS[0]}
              if [ \$exit_code -ne 0 ]; then
                  exit 1
              fi
            "

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android selftest
        uses: ReactiveCircus/android-emulator-runner@v2.34.0
        with:
          api-level: 34
          avd-name: my_avd
          target: google_apis
          arch: x86_64
          profile: pixel_xl
          script: |
            docker run --rm --network host -v "$(dirname "${{ github.workspace }}")":/workspace -v /dev/bus/usb:/dev/bus/usb -e ANDROID_HOME="/opt/rfwaio/devtools/Android" -w "/workspace/$(basename "${{ github.workspace }}")" ${{ env.AIO_IMAGE }} bash -c ". /opt/rfwaio/linux/set_robotenv.sh && \$RobotAppium/appium driver install uiautomator2 && \$RobotAppium/appium driver list --installed && \$RobotAndroidPlatformTools/adb connect localhost:5554 && python3 '../robotframework-selftest/testcases/executerobottest.py' --logfile='/home/runner/work/RobotFramework_AIO/robotframework-selftest/testcases/aiotestlogfiles/aiotestlogfile.xml' --robotcommandline='--variable run_on:Github_Action --exclude QConnectSelfTest --exclude SerialSelfTest --exclude DLTSelfTestApp'"

      - name: Upload test result
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-logs-${{ matrix.distro }}-${{ matrix.version }}
          path: |
            ${{ runner.workspace }}/**/*/aiotestlogfiles/*
            ${{ runner.workspace }}/**/*/testlogfiles/*
            ${{ github.workspace }}/static_code_log.txt
            ${{ github.workspace }}/coverage_console_log.txt
            ${{ github.workspace }}/test_log.txt

  entire-artifacts:
    name: Entire Artifacts
    runs-on: ubuntu-latest
    needs: [install-test-windows, install-test-linux]
    if: ${{ ! failure() && ! cancelled() }}

    steps:
    - name: Download artifact from build workflow
      uses: actions/download-artifact@v4

    - name: Get entire pipeline artifacts
      run: |
        mkdir entire-artifacts
        mv linux-aiotestlogfiles-* entire-artifacts
        mv windows-aiotestlogfiles-* entire-artifacts

    - name: Upload test result as artifact
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: entire-artifacts
        path: |
          ${{ runner.workspace }}/**/*/entire-artifacts/*

  release:
    name: Release AIO
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [install-test-windows, install-test-linux]
    if: ${{ ! failure() && ! cancelled() && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/rel/aio/') }}

    steps:
    - name: Download artifact from build workflow
      uses: actions/download-artifact@v4

    - name: Get released version
      run: |
        echo "RELEASE_VERSION=${TAG_NAME#rel/aio/}" >> $GITHUB_ENV
        mv windows-package-original/*.exe windows-package-original/setup_OSS_RobotFramework_AIO_Win_${TAG_NAME#rel/aio/}_original.exe
        mv windows-package-extended/*.exe windows-package-extended/setup_OSS_RobotFramework_AIO_Win_${TAG_NAME#rel/aio/}_extended.exe
        mv linux-package-original/*.deb linux-package-original/setup_OSS_RobotFramework_AIO_Linux_${TAG_NAME#rel/aio/}_original.deb
        mv linux-package-extended/*.deb linux-package-extended/setup_OSS_RobotFramework_AIO_Linux_${TAG_NAME#rel/aio/}_extended.deb
        mv windows-aiotestlogfiles-extended/release_info_RobotFramework_AIO_*.html windows-aiotestlogfiles-extended/release_info_OSS_RobotFramework_AIO_${TAG_NAME#rel/aio/}_extended.html
        mv windows-aiotestlogfiles-original/release_info_RobotFramework_AIO_*.html windows-aiotestlogfiles-original/release_info_OSS_RobotFramework_AIO_${TAG_NAME#rel/aio/}_original.html

    - name: Create/Update GitHub Release
      id: create_update_release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        omitNameDuringUpdate: true
        prerelease: true
        name: RobotFramework AIO version ${{ env.RELEASE_VERSION }}
        artifacts: "windows-package-original/*.exe,windows-package-extended/*.exe,linux-package-original/*.deb,linux-package-extended/*.deb,windows-aiotestlogfiles-extended/release_info_*.html,windows-aiotestlogfiles-original/release_info_*.html,RobotFrameworkAIO_Reference_extended/**/*.pdf,RobotFrameworkAIO_Reference_original/**/*.pdf"
        bodyFile: "windows-aiotestlogfiles-extended/release_changelog.html"

  tag-to-publish-packges-to-pypi:
    name: Tag Python packages to trigger workflow for publishing to PyPI
    runs-on: ubuntu-latest
    needs: [install-test-windows, install-test-linux]
    if: ${{ ! failure() && ! cancelled() && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/rel/aio/') }}

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: python -m pip install -r ./tools/git-tag/requirements.txt

    - name: Tag repositories
      run: |
        chmod +x ./tools/git-tag/tag_repos_with_their_version_file.sh
        ./tools/git-tag/tag_repos_with_their_version_file.sh ./config/repositories/publish_pypi_repos.txt

  update-version-aio:
    name: Update version AIO
    runs-on: ubuntu-latest
    needs: [install-test-windows, install-test-linux]
    if: ${{ ! failure() && ! cancelled() && github.ref_type == 'tag' }}

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set Up Git User
      run: |
        git config user.email "huavanthong14@gmail.com"
        git config user.name "Thong Hua"

    - name: Checkout automation branch
      run: |
        tag_branch=automation/task/update_controlfile_version
        echo $tag_branch > tag_branch.txt
        git checkout -b $tag_branch

    - name: Update version AIO on control file
      run: |
        export AIO_VERSION=${TAG_NAME#[rd]e[vl]/aio/}
        . ./include/bash/common.sh && update_debian_control_file

    - name: Commit Changes
      run: |
        tag_branch=$(cat tag_branch.txt)
        git add ./config/build/dpkg_build/control
        git commit -m "Auto commit from GitHub Actions"
        git push -u -f origin $tag_branch

    - name: Create Pull Request
      run: |
        tag_branch=$(cat tag_branch.txt)

        pr_exists=$(gh pr list --state open | grep -qw "Auto-generated pull request" && echo "found" || echo "not found")
        if [ "$pr_exists" == "not found" ]; then
          echo "Pull request not found. Creating a new one..."
          gh pr create \
          --base develop --head $tag_branch \
          --title "Auto-generated pull request" \
          --body "This PR was automatically generated by GitHub Actions to update version" \
          --assignee test-fullautomation \
          --reviewer huavanthong
        else
          echo "Pull request already exists. Skipping..."
        fi

    - name: Clean up
      run: |
        rm tag_branch.txt